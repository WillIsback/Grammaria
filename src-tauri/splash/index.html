<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammaria</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          15px system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f7f9fc;
        color: #374151;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #030712;
          color: #d1d5db;
        }
      }
      .box {
        text-align: center;
        padding: 0 1rem;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 1rem;
        border: 3px solid rgba(59, 130, 246, 0.25);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      small {
        display: block;
        margin-top: 0.4rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner" aria-hidden="true"></div>
      <p>Démarrage de Grammaria…</p>
      <small>Chargement des règles de grammaire (quelques secondes au premier lancement).</small>
    </div>
  </body>
</html>
