[package]
name = "grammaria"
version = "0.1.0"
description = "Grammaria — correcteur de français, application de bureau"
license = "GPL-3.0-or-later"
repository = "https://github.com/WillIsback/Grammaria"
edition = "2021"
rust-version = "1.90"

[lib]
name = "grammaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
# Requis par tauri::generate_context! dès que tauri.conf.json configure un plugin.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
