[package]
name = "grammaria"
version = "0.1.0"
description = "Grammaria — correcteur de français, application de bureau"
license = "GPL-3.0-or-later"
repository = "https://github.com/WillIsback/Grammaria"
edition = "2021"
rust-version = "1.80"

[lib]
name = "grammaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
