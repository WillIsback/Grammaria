[package]
name = "grammaria"
version = "0.1.0"
description = "Grammaria — correcteur de français, application de bureau"
license = "GPL-3.0-or-later"
repository = "https://github.com/WillIsback/Grammaria"
edition = "2021"
rust-version = "1.90"

[lib]
name = "grammaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
# Requis par tauri::generate_context! dès que tauri.conf.json configure un plugin ;
# sert aussi aux commandes (JSON du journal, des réglages et du modèle).
serde_json = { version = "1", features = ["raw_value"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# Journal : SQLite embarqué (compilé dans l'application, aucune bibliothèque
# système). `hooks` pour l'autorisateur, `limits` pour interdire ATTACH.
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
# Relais du modèle : mêmes reqwest, rustls et fournisseur ring que le plugin de
# mise à jour (déjà dans le binaire) : ni OpenSSL, ni seconde pile TLS.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "sync"] }
# Validation des réglages et des mots valides (déjà dans l'arbre de Tauri).
regex = "1"
url = "2"

# Correcteur grammatical : moteur Rust grammaria-rc, lié à l'application. Le paquet s'appelle
# aussi « grammaria » : il est renommé ici. La révision ci-dessous est la seule source de
# vérité : scripts/moteur/construire.sh la lit pour construire les données (moteur/data), le
# moteur du serveur et celui de l'image Docker (test : tests/unit/moteurRevision.test.ts).
grammaria_rc = { package = "grammaria", git = "https://github.com/WillIsback/grammaria-rc", rev = "7d93483067e9ef1389fa4277c546d13bb7bb7bde" }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
