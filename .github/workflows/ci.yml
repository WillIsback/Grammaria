name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Lecture seule : aucune étape n'écrit dans le dépôt ni ne publie (le cache
# d'actions/cache et de setup-node n'utilise pas le GITHUB_TOKEN). Appelé par
# release.yml, le workflow ne peut que réduire les droits transmis.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Le jeton n'est pas laissé dans .git/config pour les étapes suivantes.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format, lint & type check
        run: npm exec -- vp check

      - name: Run tests
        run: npm exec -- vp test run

      - name: Build
        run: npm run build

      # Interface de l'application de bureau (dist/bureau/). Le correcteur du
      # bureau n'est plus un Worker de la page : il est lié au backend Rust
      # (src-tauri/src/correcteur.rs), testé par build-desktop.yml.
      - name: Build du bureau
        run: npm run build:bureau

      # Moteur grammatical (grammaria-rc, Rust) à la révision épinglée dans
      # src-tauri/Cargo.toml : binaire du serveur et données (moteur/). La
      # compilation du moteur prend quelques minutes : le dossier produit
      # est mis en cache par révision. Le dépôt du moteur doit être lisible par
      # le job (dépôt public, ou jeton à ajouter au clone s'il est privé).
      - name: Révision du moteur
        id: moteur
        shell: bash
        run: |
          rev="$(sed -n 's/^grammaria_rc = .*rev = "\([0-9a-f]*\)".*/\1/p' src-tauri/Cargo.toml)"
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Cache du moteur
        id: cache-moteur
        uses: actions/cache@v4
        with:
          path: moteur
          key: moteur-${{ runner.os }}-${{ steps.moteur.outputs.rev }}

      - name: Construire le moteur
        if: steps.cache-moteur.outputs.cache-hit != 'true'
        shell: bash
        env:
          REV: ${{ steps.moteur.outputs.rev }}
        run: |
          set -euo pipefail
          git clone https://github.com/WillIsback/grammaria-rc "$RUNNER_TEMP/grammaria-rc"
          git -C "$RUNNER_TEMP/grammaria-rc" checkout --detach "$REV"
          GRAMMARIA_RC_SRC="$RUNNER_TEMP/grammaria-rc" npm run build:moteur

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Journal, routes du serveur et correcteur (moteur Rust lancé par grammar.ts).
      - name: Run journal tests (bun:sqlite)
        run: npm run test:journal
