name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Lecture seule : aucune étape n'écrit dans le dépôt ni ne publie (le cache
# d'actions/cache et de setup-node n'utilise pas le GITHUB_TOKEN). Appelé par
# release.yml, le workflow ne peut que réduire les droits transmis.
permissions:
  contents: read

env:
  # Version de Playwright du contrôle du correcteur du bureau (cache du Chromium).
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Le jeton n'est pas laissé dans .git/config pour les étapes suivantes.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format, lint & type check
        run: npm exec -- vp check

      - name: Run tests
        run: npm exec -- vp test run

      - name: Build
        run: npm run build

      # Correcteur de l'application de bureau (Worker et archive des règles,
      # dist/bureau/lt/), tel qu'il est livré, vérifié dans Chromium sous la
      # CSP stricte du bureau contre tests/fixtures/correcteur/reference.json.
      # Le script attend Playwright et son Chromium déjà installés (il ne
      # télécharge rien) ; Playwright n'est pas une dépendance du projet :
      # installé à part (NODE_PATH), avec le seul Chromium headless shell, mis
      # en cache par version.
      - name: Build du bureau
        run: npm run build:bureau

      - name: Cache Chromium (Playwright)
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-headless-shell

      - name: Installer Playwright et Chromium
        env:
          CACHE_HIT: ${{ steps.cache-chromium.outputs.cache-hit }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-package-lock \
            --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          if [ "$CACHE_HIT" != "true" ]; then
            "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --only-shell chromium
          fi

      - name: Correcteur du bureau dans Chromium (CSP stricte)
        run: |
          export NODE_PATH="$RUNNER_TEMP/playwright/node_modules"
          npm run test:correcteur-bureau

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run journal tests (bun:sqlite)
        run: npm run test:journal
