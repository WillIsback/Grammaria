name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format, lint & type check
        run: npm exec -- vp check

      - name: Run tests
        run: npm exec -- vp test run

      - name: Build
        run: npm run build

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run journal tests (bun:sqlite)
        run: npm run test:journal
