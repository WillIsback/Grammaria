# Workflow : build-desktop
# Application de bureau (Tauri 2) : paquets Linux (deb, AppImage) et Windows
# (NSIS, MSI).
#
# Plus de serveur Bun en sidecar : la page est embarquée (`beforeBuildCommand` :
# `npm run build:bureau`, Node seul), le correcteur tourne dans un Worker de la
# WebView et Rust fournit SQLite, les réglages et le relais du modèle. Bun n'est
# donc plus installé ici.
#
# Après le build, le binaire réellement produit (celui qui est empaqueté, signé
# en release) est lancé en mode autotest (variable GRAMMARIA_AUTOTEST_OUT, voir
# src-tauri/src/autotest.rs) dans sa vraie WebView : WebKitGTK sous Xvfb,
# WebView2 sous Windows, contre un faux modèle local
# (scripts/desktop/faux-modele.mjs) ; scripts/desktop/verifier-autotest.mjs
# juge le résultat. Le JSON de résultats est publié en artefact `autotest-*`.
# Une garde de taille arrête ensuite un .deb ou un installeur NSIS trop gros.
#
# Signature Windows : Azure Artifact Signing, même compte que Syntheo. Le
# quota mensuel (environ 500 signatures) est partagé : on ne signe QUE les
# builds de release, c'est-à-dire quand l'appelant passe `sign: true`
# (release.yml) ET que les secrets Azure (AZURE_TENANT_ID, AZURE_CLIENT_ID,
# AZURE_CLIENT_SECRET) sont présents. Les builds de pull request ou lancés à la
# main ne sont jamais signés.
#
# Consommation par release (bundler Tauri 2.12, une signature par appel de
# `signCommand`) : installeur NSIS 8 (grammaria.exe, 5 greffons NSIS embarqués,
# désinstalleur, installeur), MSI 4 (grammaria.exe re-signé après son
# marquage par type de paquet, 2 extensions WiX, le .msi), soit 12. Avec le
# sidecar, l'exécutable du serveur en coûtait une de plus (13).
#
# Mise à jour automatique : l'application installée vérifie chaque paquet avec
# une paire de clés propre à Tauri (minisign), distincte de la signature
# Windows et sans coût Azure. Les signatures (.sig) ne sont produites que pour
# une release (`sign: true`), quand le secret TAURI_SIGNING_PRIVATE_KEY existe
# et que la clé publique est renseignée dans src-tauri/tauri.conf.json. Sinon
# le build reste identique, sans artefact de mise à jour.
name: build-desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version injectée dans les paquets (sans « v »)"
        type: string
        required: false
        default: "0.0.0"
  workflow_call:
    inputs:
      version:
        description: "Version injectée dans les paquets (tag de release)"
        type: string
        required: true
      sign:
        description: "Signer les paquets Windows et produire les signatures de mise à jour (release uniquement)"
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
    # La page de l'application est l'interface web embarquée, avec le moteur de
    # grammaire et le journal : tout ce qu'elle importe peut casser le bureau.
    paths:
      - "src-tauri/**"
      - "src/**"
      - "scripts/desktop/**"
      - "tests/fixtures/correcteur/**"
      - "journal*.ts"
      - "index.html"
      - "public/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # glibc la plus ancienne disponible : l'AppImage tourne sur plus de distributions.
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: grammaria-desktop-linux
            slug: linux
          - name: Windows
            os: windows-latest
            bundles: nsis,msi
            artifact: grammaria-desktop-windows
            slug: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # xvfb : écran virtuel de l'autotest (dbus-run-session vient du paquet
      # dbus, toujours présent).
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install dependencies
        env:
          VP_GIT_HOOKS: "0"
        run: npm ci

      # Pré-version (v0.2.0-rc.1) : le MSI exige une version numérique
      # major.minor.patch.build. On la fixe nous-mêmes (0.2.0.1) au lieu de
      # laisser Tauri la déduire du suffixe. Windows ignore le quatrième champ
      # pour les mises à jour MSI : installez la version stable par-dessus.
      - name: Injecter la version
        shell: bash
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}
        run: |
          # shellcheck disable=SC2153 # VERSION vient de `env`.
          version="${VERSION#v}"
          # shellcheck disable=SC2016 # Script Node entre apostrophes, exprès.
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const version = process.argv[1];
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(version);
            if (!match) throw new Error(`Version invalide : ${version} (attendu : 1.2.3 ou 1.2.3-rc.1)`);
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = version;
            if (match[4]) {
              const build = Number((/(\d+)$/.exec(match[4]) ?? [, "0"])[1]);
              if (build > 65535) throw new Error(`Numéro de pré-version trop grand pour le MSI : ${build}`);
              const msi = `${match[1]}.${match[2]}.${match[3]}.${build}`;
              conf.bundle.windows.wix.version = msi;
              console.log(`Version MSI : ${msi}`);
            }
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          ' "$version"
          echo "Version : $version"

      # Décision unique de signature, appliquée par les étapes suivantes.
      - name: Décider de la signature (release Windows uniquement)
        id: signing
        shell: bash
        env:
          SIGN: ${{ inputs.sign == true }}
          HAS_AZURE_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$SIGN" != "true" ]; then
            echo "Build de test : signature désactivée (quota Azure préservé)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_AZURE_SECRET" != "true" ]; then
            echo "::warning::Release sans secrets Azure : paquets Windows NON signés."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build de release : signature activée."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier l'authentification Azure
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET -t $env:AZURE_TENANT_ID --only-show-errors
          if ($LASTEXITCODE -ne 0) {
            throw "az login a échoué (code $LASTEXITCODE). Si le message est « No subscriptions found », attribue le rôle Reader au service principal sur le groupe de ressources du compte Artifact Signing."
          }
          Write-Host "Authentification Azure OK."

      - name: Installer artifact-signing-cli
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          # Même outil, même version et même somme de contrôle que Syntheo.
          $version = "0.12.0"
          $sha256 = "dd6fa95a0367cbd32ea520037c3df72d1ed8f523a5b07883b0c2a4034e918a53"
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing-cli"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir "artifact-signing-cli.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Levminer/artifact-signing-cli/releases/download/$version/artifact-signing-cli.exe" -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($actual -ne $sha256) { throw "SHA256 invalide pour artifact-signing-cli : $actual" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configuration de signature
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          # Variables du dépôt facultatives ; par défaut, le compte et le profil de Syntheo.
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT || 'https://neu.codesigning.azure.net' }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT || 'willisback-signing' }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE || 'syntheo-public' }}
        run: |
          cat > src-tauri/tauri.windows-signing.conf.json <<EOF
          {
            "bundle": {
              "windows": {
                "signCommand": "artifact-signing-cli -e $ENDPOINT -a $ACCOUNT -c $PROFILE -d Grammaria %1"
              }
            }
          }
          EOF
          cat src-tauri/tauri.windows-signing.conf.json

      # Décision unique pour la mise à jour automatique. Le fichier de
      # configuration ajouté active `createUpdaterArtifacts` : Tauri signe alors
      # l'AppImage et l'installeur NSIS avec la clé privée lue dans les secrets.
      - name: Décider des artefacts de mise à jour (release uniquement)
        id: updater
        shell: bash
        env:
          SIGN: ${{ inputs.sign == true }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          VERSION: ${{ inputs.version || '0.0.0' }}
        run: |
          pubkey=$(node -p 'require("./src-tauri/tauri.conf.json").plugins.updater.pubkey.trim()')
          if [ "$SIGN" != "true" ]; then
            echo "Build de test : pas d'artefacts de mise à jour."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$pubkey" ]; then
            echo "::warning::Clé publique absente de src-tauri/tauri.conf.json (plugins.updater.pubkey) : pas de mise à jour automatique pour cette version."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_UPDATER_KEY" != "true" ]; then
            # Mises à jour activées (clé publique renseignée) mais secret absent :
            # une version stable publiée ainsi ne serait jamais proposée aux
            # applications installées. On arrête avant de publier quoi que ce soit.
            case "$VERSION" in
              *-*)
                echo "::warning::Pré-version sans secret TAURI_SIGNING_PRIVATE_KEY : pas de signature de mise à jour."
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::Version stable sans secret TAURI_SIGNING_PRIVATE_KEY alors que la clé publique est renseignée : la mise à jour automatique serait cassée pour cette version."
                exit 1
                ;;
            esac
          else
            echo "Build de release : artefacts de mise à jour activés."
            echo '{ "bundle": { "createUpdaterArtifacts": true } }' > src-tauri/tauri.updater.conf.json
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # `beforeBuildCommand` (src-tauri/tauri.conf.json) construit la page et le
      # correcteur embarqués : `npm run build:bureau`.
      - name: Build Tauri
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater.outputs.enabled == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          UPDATER: ${{ steps.updater.outputs.enabled }}
          AZURE_TENANT_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.enabled == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          SIGNING: ${{ steps.signing.outputs.enabled }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$SIGNING" = "true" ]; then
            extra+=(--config src-tauri/tauri.windows-signing.conf.json)
          fi
          if [ "$UPDATER" = "true" ]; then
            extra+=(--config src-tauri/tauri.updater.conf.json)
          fi
          npx tauri build --ci --bundles "$BUNDLES" "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"
          # Tauri ne fait qu'avertir quand la clé privée ne va pas avec la clé
          # publique ; les applications installées refuseraient alors la mise à jour.
          if [ "$UPDATER" = "true" ] && grep -q "does not match the public key" "$RUNNER_TEMP/tauri-build.log"; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY ne correspond pas à la clé publique de src-tauri/tauri.conf.json."
            exit 1
          fi

      # Vérifie les fichiers réellement livrés : les deux installateurs, et les
      # exécutables extraits du MSI (installation administrative, rien n'est
      # installé). Tauri signe les copies qu'il embarque, pas les fichiers de
      # target/release. Hors release, le contrôle ne fait qu'afficher l'état,
      # ce qui teste l'extraction sur chaque pull request.
      - name: Vérifier la signature des paquets Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ENFORCE: ${{ steps.signing.outputs.enabled }}
        run: |
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP "msi-extract"
          $proc = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$extract`"")
          if ($proc.ExitCode -ne 0) { throw "Extraction du MSI impossible (code $($proc.ExitCode))" }
          $inner = @(Get-ChildItem $extract -Recurse -Filter *.exe)
          if (-not ($inner | Where-Object Name -eq "grammaria.exe")) { throw "grammaria.exe absent du MSI" }
          # Plus de sidecar : un exécutable de plus dans le MSI serait livré sans
          # avoir été prévu (ni testé par l'autotest).
          $autres = @($inner | Where-Object Name -ne "grammaria.exe")
          if ($autres.Count -gt 0) { throw "Exécutables inattendus dans le MSI : $($autres.Name -join ', ')" }
          $files = @(
            Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
            $msi
          ) + $inner
          # `UnknownError` : la racine d'Artifact Signing n'est pas dans le magasin
          # du runner ; la signature reste valide (même règle que Syntheo).
          $failed = $false
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "aucun" }
            Write-Host "$($file.Name) : status=$($sig.Status) ; horodate=$([bool]$sig.TimeStamperCertificate) ; signataire=$subject"
            if (-not $sig.SignerCertificate -or $sig.Status -notin @("Valid", "UnknownError") -or -not $sig.TimeStamperCertificate) {
              $failed = $true
            }
          }
          if ($env:ENFORCE -ne "true") {
            Write-Host "Build non signé : contrôle informatif uniquement."
          } elseif ($failed) {
            throw "au moins un fichier livré n'est pas signé correctement"
          }

      # Signatures de mise à jour : seuls l'installeur NSIS et l'AppImage se
      # mettent à jour seuls. Celles du MSI et du .deb ne sont pas publiées.
      - name: Rassembler les paquets et les sommes de contrôle
        shell: bash
        env:
          UPDATER: ${{ steps.updater.outputs.enabled }}
        run: |
          set -euo pipefail
          mkdir -p dist-desktop
          bundle=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bundle"/nsis/*.exe "$bundle"/msi/*.msi dist-desktop/
            signature=("$bundle"/nsis/*-setup.exe.sig)
            sums=SHA256SUMS-windows
          else
            cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage dist-desktop/
            signature=("$bundle"/appimage/*.AppImage.sig)
            sums=SHA256SUMS-linux
          fi
          if [ "$UPDATER" = "true" ]; then
            # Sans signature, la release n'aurait pas de mise à jour : on échoue ici
            # (motif sans correspondance laissé tel quel, `cp` échoue).
            cp "${signature[@]}" dist-desktop/
            ls dist-desktop/*.sig
          fi
          (cd dist-desktop && sha256sum -- * > "$sums" && cat "$sums")

      # Garde de taille sur les paquets livrés. Mesures de la 0.3.0 : .deb
      # 8,05 Mio ; installeur NSIS estimé entre 6 et 9 Mio. Pas de seuil sur
      # l'AppImage (elle embarque WebKitGTK) ni sur le MSI, seulement affichés.
      # Un paquet attendu absent fait aussi échouer l'étape.
      - name: Garde de taille des paquets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mio=$((1024 * 1024))
          seuil_deb=$((12 * mio))
          seuil_nsis=$((14 * mio))
          if [ "$RUNNER_OS" = "Windows" ]; then
            garde=(dist-desktop/*-setup.exe)
            paquets=("${garde[@]}" dist-desktop/*.msi)
          else
            garde=(dist-desktop/*.deb)
            paquets=("${garde[@]}" dist-desktop/*.AppImage)
          fi
          if [ "${#garde[@]}" -eq 0 ]; then
            echo "::error::Paquet soumis à la garde de taille absent de dist-desktop/."
            exit 1
          fi
          echec=0
          {
            echo "### Tailles des paquets — $RUNNER_OS"
            echo
            echo "| Paquet | Taille | Seuil |"
            echo "| --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          for paquet in "${paquets[@]}"; do
            octets=$(( $(wc -c < "$paquet") ))
            case "$paquet" in
              *.deb) seuil=$seuil_deb ;;
              *-setup.exe) seuil=$seuil_nsis ;;
              *) seuil=0 ;;
            esac
            taille=$(awk -v o="$octets" -v m="$mio" 'BEGIN { printf "%.2f Mio", o / m }')
            if [ "$seuil" -gt 0 ]; then
              limite="$((seuil / mio)) Mio"
              if [ "$octets" -gt "$seuil" ]; then
                echo "::error::$(basename "$paquet") pèse $taille, au-delà du seuil de $limite."
                limite="$limite (dépassé)"
                echec=1
              fi
            else
              limite="—"
            fi
            echo "$(basename "$paquet") : $taille ($octets octets), seuil : $limite"
            echo "| $(basename "$paquet") | $taille | $limite |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          exit "$echec"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-desktop/
          retention-days: 14

      # ───────────── Autotest dans la vraie application ─────────────
      # Le binaire lancé est celui de target/release : celui que Tauri vient
      # d'empaqueter (et de signer, en release). Pas de second build.
      #
      # Placé après la publication des paquets et lancé dès que le build a
      # réussi (`!cancelled() && steps.build.outcome == 'success'`) : un
      # dépassement de la garde de taille n'empêche pas l'autotest, et un
      # autotest en échec laisse les paquets téléchargeables pour essayer à la
      # main. Le job échoue quand même : release.yml ne publie rien.
      #
      # Chaque étape de lancement démarre le faux modèle et l'application dans
      # le même shell (un processus d'arrière-plan ne survit pas toujours à son
      # étape sous Windows), enregistre le code de sortie de l'application sans
      # échouer, et laisse l'étape « vérification et résumé » juger : ainsi le
      # vérificateur détaille toujours les critères, même quand l'application
      # a échoué. L'application se ferme seule (code 0 ou 1) ou au bout de
      # 170 s (délai interne, code 1) ; le délai de 200 s ci-dessous n'est
      # qu'un filet si elle restait bloquée.

      # WebView2 est préinstallé sur les images windows-latest (avec Edge) ; on
      # le vérifie, et on l'installe s'il manquait, pour ne pas confondre une
      # image sans WebView2 avec un échec de l'application.
      - name: Autotest — WebView2 présent (Windows)
        id: webview2
        if: runner.os == 'Windows' && !cancelled() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $cles = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          function Get-VersionWebView2 {
            foreach ($cle in $cles) {
              $pv = (Get-ItemProperty -LiteralPath $cle -Name pv -ErrorAction SilentlyContinue).pv
              if ($pv -and $pv -ne "0.0.0.0") { return $pv }
            }
            return $null
          }
          $version = Get-VersionWebView2
          if (-not $version) {
            Write-Host "::warning::WebView2 Runtime absent de l'image : installation (Evergreen Bootstrapper)."
            $setup = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest -UseBasicParsing -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $setup
            $installation = Start-Process -FilePath $setup -ArgumentList "/silent", "/install" -Wait -PassThru
            if ($installation.ExitCode -ne 0) { throw "Installation de WebView2 impossible (code $($installation.ExitCode))" }
            $version = Get-VersionWebView2
            if (-not $version) { throw "WebView2 toujours absent après installation" }
          }
          Write-Host "WebView2 Runtime : $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Autotest — application réelle (Linux, WebKitGTK sous Xvfb)
        if: runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/autotest"
          rm -rf "$dir"
          mkdir -p "$dir/home"
          node scripts/desktop/faux-modele.mjs > "$dir/faux-modele.log" 2>&1 &
          modele=$!
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:31977/v1/models > /dev/null && break
            sleep 0.2
          done
          debut=$(date +%s)
          code=0
          # Dossiers personnels isolés : rien n'est écrit chez l'utilisateur du
          # runner (l'application range déjà ses données à côté du JSON).
          # timeout tue tout le groupe (xvfb-run, dbus, application) au besoin.
          env HOME="$dir/home" \
            XDG_DATA_HOME="$dir/home/data" \
            XDG_CONFIG_HOME="$dir/home/config" \
            XDG_CACHE_HOME="$dir/home/cache" \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            GRAMMARIA_AUTOTEST_OUT="$dir/autotest.json" \
            timeout --kill-after=10 200 \
            xvfb-run -a dbus-run-session -- src-tauri/target/release/grammaria \
            > "$dir/app.log" 2>&1 || code=$?
          duree=$(( $(date +%s) - debut ))
          kill "$modele" 2> /dev/null || true
          echo "$code" > "$dir/code-application"
          echo "$duree" > "$dir/duree-application"
          echo "Application fermée avec le code $code en $duree s (lancement compris)."

      - name: Autotest — application réelle (Windows, WebView2)
        if: runner.os == 'Windows' && !cancelled() && steps.build.outcome == 'success'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "autotest"
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # Chemin complet de node.exe : avec redirection, Start-Process ne passe
          # pas par le shell.
          $node = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          $modele = Start-Process -FilePath $node -ArgumentList "scripts/desktop/faux-modele.mjs" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput (Join-Path $dir "faux-modele.log") `
            -RedirectStandardError (Join-Path $dir "faux-modele.err.log")
          $pret = $false
          for ($i = 0; $i -lt 50 -and -not $pret; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:31977/v1/models" -TimeoutSec 2 | Out-Null
              $pret = $true
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          if (-not $pret) { Write-Host "::warning::Faux modèle injoignable sur 127.0.0.1:31977." }

          # Application à sous-système graphique : `&` ne l'attendrait pas.
          # Start-Process -PassThru, puis WaitForExit avec délai ; lire Handle
          # tout de suite, sinon ExitCode reste vide une fois le processus fini.
          # L'environnement (GRAMMARIA_AUTOTEST_OUT) est hérité par l'enfant.
          $env:GRAMMARIA_AUTOTEST_OUT = Join-Path $dir "autotest.json"
          $exe = (Resolve-Path -LiteralPath "src-tauri\target\release\grammaria.exe").Path
          $chrono = [System.Diagnostics.Stopwatch]::StartNew()
          $app = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput (Join-Path $dir "app.log") `
            -RedirectStandardError (Join-Path $dir "app.err.log")
          $null = $app.Handle
          if ($app.WaitForExit(200000)) {
            $app.WaitForExit()
            $code = $app.ExitCode
          } else {
            Write-Host "::error::Application toujours ouverte après 200 s : arrêt forcé (WebView2 et enfants compris)."
            $app.Kill($true)
            $app.WaitForExit()
            $code = 124
          }
          $chrono.Stop()
          Remove-Item Env:GRAMMARIA_AUTOTEST_OUT
          Stop-Process -Id $modele.Id -Force -ErrorAction SilentlyContinue

          $duree = [int]$chrono.Elapsed.TotalSeconds
          Set-Content -LiteralPath (Join-Path $dir "code-application") -Value "$code" -Encoding ascii
          Set-Content -LiteralPath (Join-Path $dir "duree-application") -Value "$duree" -Encoding ascii
          Write-Host "Application fermée avec le code $code en $duree s (lancement compris)."

      # Juge les résultats (scripts/desktop/verifier-autotest.mjs : détections
      # identiques à tests/fixtures/correcteur/reference.json, lot SQLite
      # atomique, flux du modèle, aucune violation de la CSP, « Edg/ » dans
      # l'agent utilisateur sous Windows…) et écrit le résumé du job.
      - name: Autotest — vérification et résumé
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          WEBVIEW2: ${{ steps.webview2.outputs.version }}
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/autotest"
          code=$(tr -d '\r\n' < "$dir/code-application" 2> /dev/null || true)
          duree=$(tr -d '\r\n' < "$dir/duree-application" 2> /dev/null || true)
          verification=0
          node scripts/desktop/verifier-autotest.mjs "$dir/autotest.json" \
            > "$dir/verification.txt" 2>&1 || verification=$?
          cat "$dir/verification.txt"
          moteur="WebKitGTK"
          [ "$RUNNER_OS" = "Windows" ] && moteur="WebView2 ${WEBVIEW2:-?}"
          {
            echo "### Autotest de l'application — $RUNNER_OS ($moteur)"
            echo
            echo "Application : code ${code:-absent} en ${duree:-?} s ; vérificateur : code $verification."
            echo
            grep '^Temps' "$dir/verification.txt" || true
            echo
            echo '<details><summary>Critères</summary>'
            echo
            echo '```'
            cat "$dir/verification.txt"
            echo '```'
            echo
            echo '</details>'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ] || [ "$verification" != "0" ]; then
            echo "--- journal de l'application (fin) ---"
            tail -n 80 "$dir/app.log" 2> /dev/null || true
            tail -n 80 "$dir/app.err.log" 2> /dev/null || true
            echo "::error::Autotest de l'application en échec (application : ${code:-absent}, vérificateur : $verification). Détails dans l'artefact autotest-${RUNNER_OS,,}."
            exit 1
          fi

      # Toujours publié : les temps (Windows surtout) restent lisibles à chaque
      # build. En cas d'échec, les journaux et les données de l'autotest
      # (journal SQLite, réglages) sont dans le même dossier.
      - name: Autotest — publier les résultats
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: autotest-${{ matrix.slug }}
          path: ${{ runner.temp }}/autotest/
          if-no-files-found: warn
          retention-days: 14
