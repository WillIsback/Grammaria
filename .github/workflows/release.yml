name: Release

on:
  push:
    tags:
      - "v*"
  # Lancement manuel (onglet Actions ou API) : le workflow crée lui-même le tag
  # sur le commit choisi (main par défaut) au moment de publier la release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier, par exemple v0.2.0 ou v0.2.0-rc.1 (pré-version)"
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Tag publié : celui poussé, ou celui saisi au lancement manuel.
  TAG: ${{ inputs.tag || github.ref_name }}
  # Pré-version : tag avec suffixe, par exemple v0.2.0-rc.1 ou v0.2.0-1. Elle est
  # publiée comme pré-version GitHub et ne touche ni à l'image Docker
  # « latest », ni aux étiquettes major.minor, ni à la release « Latest ».
  PRERELEASE: ${{ contains(inputs.tag || github.ref_name, '-') }}

jobs:
  # Lancement manuel : refuser un tag mal formé ou déjà existant avant de construire.
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le tag
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag invalide : $TAG (attendu : v1.2.3 ou v1.2.3-rc.1)"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && \
            git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$TAG" > /dev/null; then
            echo "::error::Le tag $TAG existe déjà."
            exit 1
          fi
          echo "Tag : $TAG (pré-version : $PRERELEASE)"

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  # Application de bureau : seule une release signe les paquets Windows et
  # produit les signatures de mise à jour.
  desktop:
    needs: ci
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      sign: true
    secrets: inherit

  release:
    needs: [check-tag, ci, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.PRERELEASE != 'true' }}
            type=raw,value=latest,enable=${{ env.PRERELEASE != 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}

      # Une pré-version installe sa propre image ; une version stable, « latest ».
      - name: Patch install.sh with actual image name
        env:
          IMAGE_TAG: ${{ env.PRERELEASE == 'true' && steps.meta.outputs.version || 'latest' }}
          REPO: ${{ github.repository }}
        # Docker refuse les majuscules dans un nom d'image : « WillIsback/Grammaria »
        # devient « willisback/grammaria » (${REPO,,}). La dernière ligne arrête la
        # release si le script publié ne porte pas un nom d'image valide.
        run: |
          sed -i "s|ghcr.io/OWNER/grammaria:latest|ghcr.io/${REPO,,}:${IMAGE_TAG}|g" install.sh
          grep -Eq '^IMAGE="ghcr\.io/[a-z0-9._/-]+:[A-Za-z0-9._-]+"$' install.sh

      # Seulement les paquets (grammaria-desktop-linux, grammaria-desktop-windows) :
      # les résultats de l'autotest (autotest-*) ne sont pas publiés.
      - name: Download desktop packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: grammaria-desktop-*
          path: desktop
          merge-multiple: true

      # Les fichiers publiés sont exactement ceux que build-desktop a contrôlés
      # (signatures Azure vérifiées sur Windows, autotest, garde de taille) :
      # on revérifie leurs sommes de contrôle et la présence de chaque paquet.
      # Windows : installeur NSIS et MSI ; Linux : .deb et AppImage.
      - name: Vérifier les paquets et leurs sommes de contrôle
        run: |
          set -euo pipefail
          cd desktop
          ls -l
          for motif in '*-setup.exe' '*.msi' '*.deb' '*.AppImage' SHA256SUMS-linux SHA256SUMS-windows; do
            if ! compgen -G "$motif" > /dev/null; then
              echo "::error::Paquet absent de la release : $motif"
              exit 1
            fi
          done
          sha256sum --check --strict SHA256SUMS-linux SHA256SUMS-windows

      # Manifeste de mise à jour de l'application de bureau. Les applications
      # installées le lisent sur la dernière release stable
      # (…/releases/latest/download/latest.json) : il n'est donc écrit que pour
      # une version stable, jamais pour une pré-version (alpha, rc).
      # scripts/desktop/update-manifest.ts tourne sous Node (≥ 22.18, types
      # effacés) : plus besoin de Bun dans ce job.
      - name: Setup Node.js
        if: env.PRERELEASE != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Manifeste de mise à jour (version stable uniquement)
        if: env.PRERELEASE != 'true'
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pubkey=$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | tr -d '[:space:]')
          if ! ls desktop/*.sig > /dev/null 2>&1; then
            if [ -n "$pubkey" ]; then
              # Mises à jour activées mais aucune signature : sans manifeste, les
              # applications installées ne verraient jamais cette version.
              echo "::error::Version stable sans signature de mise à jour alors que la clé publique est renseignée (secret TAURI_SIGNING_PRIVATE_KEY manquant ?)."
              exit 1
            fi
            echo "::warning::Mises à jour automatiques pas encore activées (clé publique vide dans src-tauri/tauri.conf.json) : release publiée sans latest.json."
            exit 0
          fi
          node scripts/desktop/update-manifest.ts desktop "$TAG" "$REPO"
          cat desktop/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Lancement manuel : le tag est créé ici, sur le commit construit.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          # En tête des notes : quel fichier prendre, pour qui arrive ici sans
          # connaître les noms de paquets. La liste des changements suit.
          body: |
            ## Installer Grammaria

            Le plus simple : **[grammaria.fr/telecharger](https://grammaria.fr/telecharger/)**, un bouton par système.

            Sinon, prenez ci-dessous, dans « Assets », le fichier dont le nom se termine ainsi :

            | Votre ordinateur | Fichier à prendre |
            |---|---|
            | Windows | `x64-setup.exe` |
            | Linux : Ubuntu, Debian, Mint | `amd64.deb` |
            | Autre Linux | `amd64.AppImage` |

            Les autres fichiers servent aux services informatiques (`.msi`), aux vérifications et aux mises à jour (`.sig`, `latest.json`, `SHA256SUMS`) et à l'installation sur un serveur (`install.sh`).

            Déjà installé ? L'application propose la mise à jour d'elle-même.
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          files: |
            install.sh
            desktop/*
