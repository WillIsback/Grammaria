name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pré-version : tag avec suffixe, par exemple v0.2.0-rc.1 ou v0.2.0-1. Elle est
  # publiée comme pré-version GitHub et ne touche ni à l'image Docker
  # « latest », ni aux étiquettes major.minor, ni à la release « Latest ».
  PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Application de bureau : seule une release signe les paquets Windows.
  desktop:
    needs: ci
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ github.ref_name }}
      sign: true
    secrets: inherit

  release:
    needs: [ci, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Une pré-version installe sa propre image ; une version stable, « latest ».
      - name: Patch install.sh with actual image name
        env:
          IMAGE_TAG: ${{ env.PRERELEASE == 'true' && steps.meta.outputs.version || 'latest' }}
        run: |
          sed -i "s|ghcr.io/OWNER/grammaria:latest|ghcr.io/${{ github.repository }}:${IMAGE_TAG}|g" install.sh

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: grammaria-desktop-*
          path: desktop
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
          files: |
            install.sh
            desktop/*
